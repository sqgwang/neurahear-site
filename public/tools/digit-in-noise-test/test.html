<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>iDIN Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css?v=idin-20260907-guide-1" />
  <link rel="stylesheet" href="css/participant.css?v=idin-20260907-guide-1">
  <link rel="stylesheet" href="css/tutorial.css?v=idin-20260907-guide-1">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/brand/neurahear-mark.svg" alt="NeuraHear">iDIN</div>
    <div class="lang-switch">
      <select id="uiLang" aria-label="Language" data-i18n-title="languageLabel">
        <option value="english">English</option>
        <option value="mandarin">普通话</option>
      </select>
    </div>
  </header>

  <main class="container test-page">
    <h2 id="condTitle" data-i18n="condTitle">Condition</h2>
    <p id="condText"></p>

    <div class="progress-row">
      <div id="phaseBadge" class="phase-badge">Practice</div>
      <div id="progress">Trial 0/0</div>
      <div id="testStateBadge" class="test-state-badge" data-state="ready">Ready</div>
    </div>
    <div id="statusMsg" class="note status-panel" aria-live="polite"></div>

    <div class="audiocontrol center">
      <button id="playTrial" class="primary" data-i18n="play">Play</button>
      <div id="playHint" class="note" data-i18n="playHint">After playback, type the digits and press OK.</div>
    </div>

    <div class="display center">
      <div id="input" class="display-box"></div>
    </div>

    <div class="keypad center" id="keypad">
      <div class="kp-row">
        <button class="keypad-button" data-val="1">1</button>
        <button class="keypad-button" data-val="2">2</button>
        <button class="keypad-button" data-val="3">3</button>
      </div>
      <div class="kp-row">
        <button class="keypad-button" data-val="4">4</button>
        <button class="keypad-button" data-val="5">5</button>
        <button class="keypad-button" data-val="6">6</button>
      </div>
      <div class="kp-row">
        <button class="keypad-button" data-val="7">7</button>
        <button class="keypad-button" data-val="8">8</button>
        <button class="keypad-button" data-val="9">9</button>
      </div>
      <div class="kp-row">
        <button class="keypad-button" id="clear"
                data-i18n-title="backspace" title="Backspace"
                aria-label="Backspace" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"
               stroke="currentColor" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 5H9.5L3 12l6.5 7H20a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path>
            <path d="m14 9 4 4"></path>
            <path d="m18 9-4 4"></path>
          </svg>
          <span data-i18n="backspace">Delete</span>
        </button>
        <button class="keypad-button" data-val="0">0</button>
        <button id="ok" class="keypad-button primary" data-i18n="ok">OK</button>
      </div>
    </div>

    <div class="center">
      <button id="nextConditionBtn" style="display:none;" data-i18n="nextCond">Next Condition</button>
      <button id="reviewTutorial" class="tutorial-link" type="button" data-i18n="guideReview">Review instructions</button>
    </div>
  </main>

  <dialog id="dinTutorial" class="tutorial" aria-labelledby="guideTitle" aria-describedby="guideText">
    <div class="guide-top">
      <span id="guideStep"></span>
      <button id="guideSkip" class="tutorial-link" type="button" data-i18n="guideSkip">Skip tutorial</button>
    </div>
    <h2 id="guideTitle" tabindex="-1"></h2>
    <p id="guideText"></p>
    <div class="guide-example">
      <p id="guideExampleLabel"></p>
      <div id="guideHeard" class="guide-digits" aria-label="Example"></div>
      <button id="guideReplay" class="tutorial-link" type="button" data-i18n="guideReplay">Show again</button>
    </div>
    <div id="guideTry">
      <div id="guideAnswer" class="guide-digits" role="group"></div>
      <p id="guideFeedback" role="status" aria-live="polite"></p>
      <div id="guideKeypad" class="guide-keypad">
        <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
        <button type="button" id="guideDelete" data-i18n="backspace">Delete</button><button type="button" data-digit="0">0</button><button type="button" id="guideCheck" class="primary" data-i18n="ok">OK</button>
      </div>
    </div>
    <div id="guideResult" class="guide-result">
      <p data-i18n="guideAnswerLabel">You enter:</p>
      <div id="guideExpected" class="guide-digits"></div>
    </div>
    <p id="guideNote"></p>
    <div class="guide-actions">
      <button id="guideBack" class="secondary" type="button" data-i18n="guideBack">Back</button>
      <button id="guideNext" class="primary" type="button"></button>
    </div>
  </dialog>

  <script src="js/i18n.js?v=idin-20260907-guide-1"></script>
  <script src="js/app.js?v=idin-20260907-guide-1"></script>
  <script src="js/tutorial.js?v=idin-20260907-guide-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const sel = document.getElementById('uiLang');
      sel.value = localStorage.getItem('uiLang') || 'english';
      sel.addEventListener('change', () => { localStorage.setItem('uiLang', sel.value); setUILanguage(sel.value); });
      setUILanguage(sel.value);

      // prepare UI
      const keypad = document.getElementById('keypad');
      keypad.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (window.dinUI?.inputLocked || b.disabled) return;
        if (b.id === 'clear') {
          clearInput();
          return;
        }
        if (b.id === 'ok') {
          submitInput();
          return;
        }
        const v = b.dataset.val;
        if (!v) return;
        appendInput(v);
      });

      document.getElementById('playTrial').addEventListener('click', async () => {
        // calling startTrialPlay which is in app.js
        document.getElementById('statusMsg').textContent = '';
        await startTrialPlay(); // render and play; returns when play finished and input enabled
      });

      document.getElementById('nextConditionBtn').addEventListener('click', () => {
        proceedToNextCondition();
      });

      // auto-start condition intro (showConditionIntro in app.js)
      showConditionIntro();
    });
  </script>
</body>
</html>
