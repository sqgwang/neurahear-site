      <rect width="128" height="128" fill="#ffffff" />
      <rect x="52" y="47" width="30" height="12" rx="1.5" transform="rotate(-34 67 53)" fill="#000000" />
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#f6f7f3" />
  <rect x="0" y="0" width="16" height="630" fill="#0f766e" />

  <g transform="translate(76 76)">
