    <text x="3" y="84" fill="#666666" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="0">BY HK AUDIOLOGY GROUP · THE UNIVERSITY OF HONG KONG</text>

    <text x="0" y="264" fill="#171717" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="720" letter-spacing="0">AI-enabled hearing care</text>
    <text x="0" y="338" fill="#171717" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="720" letter-spacing="0">and digital assessment</text>
    <text x="2" y="413" fill="#5f666d" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="520" letter-spacing="0">Research evidence translated into accessible hearing tools.</text>
